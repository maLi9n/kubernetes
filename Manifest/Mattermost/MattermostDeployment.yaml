---
apiVersion: v1
kind: Namespace
metadata:
  name: mattermost
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
  namespace: mattermost
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ExternalName
  externalName: 192.168.40.83
  selector:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mattermost
  namespace: mattermost
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.mm.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: mattermost
          port: 8065
    - match: Host(`mm.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: mattermost
          port: 8065
      middlewares:
        - name: bouncer
          namespace: traefik
        - name: default-headers
          namespace: traefik
        - name: rate-limit
          namespace: traefik
#  tls:
#    secretName: cybertronlabs-tls # change to your cert name
