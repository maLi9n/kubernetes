apiVersion: v1
kind: Namespace
metadata:
  name: chat

---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: chat
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ExternalName
  externalName: 192.168.40.233
  selector:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chat
  namespace: chat
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.chat.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: chat
          port: 8080
    - match: Host(`chat.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: chat
          port: 8080
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: authentik-outpost
          namespace: traefik
        - name: rate-limit
          namespace: traefik
  tls:
    secretName: cybertronlabs-tls # change to your cert name

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-outpost
  namespace: chat
spec:
  forwardAuth:
     # This address should point to the cluster endpoint provided by the kubernetes service, not the Ingress.
     address: http://authentik-server.default/outpost.goauthentik.io/auth/traefik
     trustForwardHeader: true
     authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
  namespace: chat
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 15552000
    customFrameOptionsValue: SAMEORIGIN
    customRequestHeaders:
      X-Forwarded-Proto: https

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: chat
spec:
  rateLimit:
    average: 100
    burst: 50
