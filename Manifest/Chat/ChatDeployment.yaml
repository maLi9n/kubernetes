apiVersion: v1
kind: Namespace
metadata:
  name: chat

---
apiVersion: v1
kind: Service
metadata:
  name: chat
  namespace: chat
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ExternalName
  externalName: 192.168.40.233
  selector:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chat
  namespace: chat
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.chat.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: chat
          port: 8080
    - match: Host(`chat.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: chat
          port: 8080
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: authentik-outpost
          namespace: traefik
        - name: rate-limit
          namespace: traefik
#  tls:
#    secretName: cybertronlabs-tls # change to your cert name
