---
apiVersion: v1
kind: Namespace
metadata:
  name: kuma
---
apiVersion: v1
kind: Service
metadata:
  name: kuma
  namespace: kuma
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ExternalName
  externalName: 192.168.40.8
  selector:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kuma
  namespace: kuma
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.kuma.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: kuma
          port: 32768
    - match: Host(`kuma.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: kuma
          port: 32768
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: authentik-outpost
          namespace: traefik
        - name: rate-limit
          namespace: traefik
  tls:
    secretName: cybertronlabs-tls # change to your cert name
