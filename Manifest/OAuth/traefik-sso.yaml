apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: traefik-sso
    app.kubernetes.io/instance: traefik-sso
  name: traefik-sso
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-sso
  template:
    metadata:
      labels:
        app: traefik-sso
    spec:
      nodeSelector:
        worker: "true"
      containers:
      - name: traefik-sso
        image: thomseddon/traefik-forward-auth:2
        imagePullPolicy: Always
        env:
        - name: PROVIDERS_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: traefik-sso
              key: clientid
        - name: PROVIDERS_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: traefik-sso
              key: clientsecret
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: traefik-sso
              key: secret
        - name: COOKIE_DOMAIN
          value: cybertronlabs.us
        - name: AUTH_HOST
          value: oauth.cybertronlabs.us
        - name: INSECURE_COOKIE
          value: "false"
        # - name: URL_PATH 
        #   value: /_oauth
        - name: WHITELIST
          value: francisco.a.duran.2@gmail.com
        - name: LOG_LEVEL
          value: debug
        ports:
        - containerPort: 4181
---
kind: Service
apiVersion: v1
metadata:
  name: traefik-sso
spec:
  selector:
    app: traefik-sso
  ports:
  - protocol: TCP
    port: 4181
    targetPort: 4181
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-sso
spec:
  forwardAuth:
    address: http://traefik-sso:4181
    authResponseHeaders: 
        - "X-Forwarded-User"
    trustForwardHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-sso
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`oauth.cybertronlabs.us`)
    kind: Rule
    services:
    - name: traefik-sso
      port: 4181
    middlewares:
      - name: traefik-sso
  tls:
    secretName: cybertronlabs-tls
