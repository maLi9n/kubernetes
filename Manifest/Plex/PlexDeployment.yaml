---
apiVersion: v1
kind: Namespace
metadata:
  name: plex
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: plex
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ExternalName
  externalName: 192.168.40.172
  selector:
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/name: traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex
  namespace: plex
  annotations: 
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`www.plex.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: plex
          port: 32400
    - match: Host(`plex.cybertronlabs.us`) # change to your domain
      kind: Rule
      services:
        - name: plex
          port: 32400
      middlewares:
        - name: default-headers
          namespace: traefik
        - name: rate-limit
          namespace: traefik
  tls:
    secretName: cybertronlabs-tls # change to your cert name
